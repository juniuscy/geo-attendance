name: Build Android app

# Runs every time code is pushed, or by clicking "Run workflow" on the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm ci

      - name: Set version number
        run: |
          node -e "
            const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p));
            j.expo.android.versionCode=${{ github.run_number }};
            j.expo.version='1.0.${{ github.run_number }}';
            fs.writeFileSync(p,JSON.stringify(j,null,2));"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign \
            --ks keystore/release.keystore --ks-key-alias geoattendance \
            --ks-pass pass:GeoAtt2026pass --key-pass pass:GeoAtt2026pass \
            --out GeoAttendance.apk android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify GeoAttendance.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Geo Attendance 1.0.${{ github.run_number }}
          body: Download **GeoAttendance.apk** below on your Android phone and open it to install.
          files: GeoAttendance.apk
